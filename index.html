<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Yörünge — Neon Refleks Oyunu</title>
<meta name="description" content="Tek dokunuşla yön değiştir, ışınlardan kaç, orb topla. Tarayıcıda anında oyna, indirme yok.">
<meta name="theme-color" content="#07071a">
<meta property="og:title" content="Yörünge — Neon Refleks Oyunu">
<meta property="og:description" content="30 saniyede rekorunu kırabilir misin? İndirmeden oyna.">
<style>
  :root { --neon:#3df2ff; --pink:#ff3df2; --gold:#ffd23d; --red:#ff3d5a; --bg:#07071a; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#fff; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; }
  .hud { position:fixed; top:max(14px,env(safe-area-inset-top)); left:0; right:0; text-align:center; pointer-events:none; }
  .hud .score { font-size:44px; font-weight:800; letter-spacing:2px; text-shadow:0 0 18px var(--neon); }
  .hud .combo { font-size:15px; color:var(--gold); height:20px; text-shadow:0 0 10px var(--gold); }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; background:rgba(7,7,26,.72); backdrop-filter:blur(4px); }
  .hidden { display:none !important; }
  h1 { font-size:46px; letter-spacing:6px; color:var(--neon); text-shadow:0 0 24px var(--neon),0 0 48px var(--pink); }
  .sub { color:#b9b9e6; font-size:16px; line-height:1.5; max-width:320px; }
  .big { font-size:64px; font-weight:800; text-shadow:0 0 22px var(--neon); }
  .best { color:var(--gold); font-size:16px; }
  button { font:inherit; font-size:19px; font-weight:700; border:0; border-radius:14px; padding:15px 28px; min-width:240px; cursor:pointer; color:#07071a; background:var(--neon); box-shadow:0 0 22px rgba(61,242,255,.6); }
  button.alt { background:transparent; color:#fff; border:2px solid var(--pink); box-shadow:0 0 16px rgba(255,61,242,.45); }
  a.more { display:inline-block; margin-top:14px; color:#41f0ff; font-weight:700; text-decoration:none; border-bottom:1px dashed #41f0ff; padding-bottom:2px; }
  button:active { transform:scale(.97); }
  #banner { min-height:50px; width:100%; max-width:340px; display:flex; justify-content:center; }
  .foot { position:fixed; bottom:max(8px,env(safe-area-inset-bottom)); left:0; right:0; text-align:center; font-size:11px; color:#6c6c99; }
  .foot a { color:#8f8fc2; }
</style>
<!-- Reklam ve analiz kodları aşağıdaki CONFIG doldurulunca otomatik eklenir. -->
</head>
<body>
<canvas id="game_canvas"></canvas>

<div class="hud"><div class="score" id="score">0</div><div class="combo" id="combo"></div></div>

<div class="screen" id="menu">
  <h1>YÖRÜNGE</h1>
  <p class="sub" data-t="howto">Ekrana dokun, yön değiştir.<br>Kırmızı ışınlardan kaç, altın orbları topla.</p>
  <p class="best" id="menuBest"></p>
  <button id="playBtn" data-t="play">OYNA</button>
  <a class="more" id="moreMenu" href="https://muslihancihan223-bot.github.io/" data-t="more">🎮 3.000+ oyun daha → HemenOyna</a>
  <div id="bannerMenu"></div>
</div>

<div class="screen hidden" id="over">
  <p class="sub" data-t="score">SKOR</p>
  <div class="big" id="finalScore">0</div>
  <p class="best" id="finalBest"></p>
  <button id="reviveBtn" class="alt hidden" data-t="revive">▶ Reklam izle, devam et</button>
  <button id="againBtn" data-t="again">TEKRAR OYNA</button>
  <button id="shareBtn" class="alt" data-t="share">Arkadaşına meydan oku</button>
  <a class="more" id="moreOver" href="https://muslihancihan223-bot.github.io/" data-t="more">🎮 3.000+ oyun daha → HemenOyna</a>
  <div id="banner"></div>
</div>

<div class="foot"><span data-t="foot">İndirme yok, tarayıcıda oynanır</span> · <a href="gizlilik.html" data-t="privacy">Gizlilik</a></div>

<script>
/* =====================================================================
   AYARLAR — para kazanmak için sadece burayı dolduracaksın.
   Boş bırakılan özellik kapalı kalır, oyun yine çalışır.
   ===================================================================== */
const CONFIG = {
  // 1) Google AdSense H5 Games Ads (oyun içi geçiş + ödüllü reklam).
  //    AdSense onayı + H5 Games beta erişimi gerekir. Örnek: "ca-pub-1234567890123456"
  adsenseClient: "",
  adsenseTestMode: true,          // Onay gelene kadar true kalsın (gerçek tıklama sayılmaz).

  // 2) Banner reklam (Adsterra / Monetag vb.). Ağın verdiği <script> kodunun SRC adresi
  //    ve banner anahtarı. Adsterra "Banner 320x50" için atOptions anahtarını yaz.
  adsterraBannerKey: "3997af85d4829bbacda7b2484c989903",          // örn: "a1b2c3d4e5f6..." (Adsterra panelinde Banner 320x50 kodundaki key)

  // 3) Ziyaret / QR sayacı (ücretsiz GoatCounter). goatcounter.com'da açtığın kod. örn: "yorunge"
  goatcounterCode: "yorunge",

  // Kaç oyunda bir geçiş reklamı denensin (AdSense ayrıca kendi sıklık sınırını uygular).
  interstitialEvery: 2,
};

/* ---------- Dil: Türkçe cihazlarda Türkçe, diğerlerinde İngilizce ---------- */
const LANG = (navigator.language || "en").toLowerCase().startsWith("tr") ? "tr" : "en";
const TEXTS = {
  tr: { best: "En iyi: ", record: "YENİ REKOR!", copied: "Link kopyalandı ✓",
        shareText: (n) => "Yörünge'de " + n + " yaptım, geçebilir misin?" },
  en: { howto: "Tap to flip direction.<br>Dodge the red beams, grab the gold orbs.", play: "PLAY", score: "SCORE",
        revive: "▶ Watch an ad to continue", again: "PLAY AGAIN", share: "Challenge a friend", more: "🎮 3,000+ more games →",
        foot: "No download, plays in your browser", privacy: "Privacy",
        best: "Best: ", record: "NEW RECORD!", copied: "Link copied ✓",
        shareText: (n) => "I scored " + n + " in Yorunge. Can you beat it?" },
};
const T = TEXTS[LANG];
document.documentElement.lang = LANG;
if (LANG !== "tr") document.querySelectorAll("[data-t]").forEach((el) => { if (T[el.dataset.t]) el.innerHTML = T[el.dataset.t]; });

/* ---------- QR kaynağı: ?src=durak gibi. Hangi QR'ın kaç oyuncu getirdiğini ayırır ---------- */
const params = new URLSearchParams(location.search);
const SRC = (params.get("src") || "direkt").toLowerCase().replace(/[^a-z0-9\-_]/g, "").slice(0, 40) || "direkt";
["moreMenu","moreOver"].forEach((id) => { const a = document.getElementById(id); if (!a) return;
  a.href = "https://muslihancihan223-bot.github.io/?src=yorunge-" + SRC;
  a.addEventListener("click", () => { try { track("hemenoyna-tik"); } catch (e) {} }); });

/* ---------- Analiz ---------- */
function track(name) {
  try {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({ path: name + "/" + SRC, title: name, event: true });
    }
  } catch (e) {}
}
if (CONFIG.goatcounterCode) {
  window.goatcounter = { path: "/oyun/" + SRC };
  const g = document.createElement("script");
  g.async = true;
  g.src = "https://gc.zgo.at/count.js";
  g.dataset.goatcounter = "https://" + CONFIG.goatcounterCode + ".goatcounter.com/count";
  document.head.appendChild(g);
}

/* ---------- AdSense H5 Games Ads (Ad Placement API) ---------- */
window.adsbygoogle = window.adsbygoogle || [];
const adBreak = window.adBreak = function (o) { window.adsbygoogle.push(o); };
const adConfig = window.adConfig = function (o) { window.adsbygoogle.push(o); };
const ADS_ON = !!CONFIG.adsenseClient;
if (ADS_ON) {
  const s = document.createElement("script");
  s.async = true;
  s.crossOrigin = "anonymous";
  s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + CONFIG.adsenseClient;
  s.dataset.adFrequencyHint = "30s";
  if (CONFIG.adsenseTestMode) s.dataset.adbreakTest = "on";
  document.head.appendChild(s);
  adConfig({ preloadAdBreaks: "on", sound: "on" });
}

/* ---------- Banner (Adsterra 320x50) ---------- */
function showBanner(containerId) {
  if (!CONFIG.adsterraBannerKey) return;
  const box = document.getElementById(containerId);
  if (!box || box.dataset.loaded) return;
  box.dataset.loaded = "1";
  // Adsterra banner kodu document.write kullandığı için izole bir iframe içinde çalıştırılır.
  const f = document.createElement("iframe");
  f.width = 320; f.height = 50; f.style.border = "0"; f.scrolling = "no";
  box.appendChild(f);
  const k = CONFIG.adsterraBannerKey;
  f.contentDocument.open();
  f.contentDocument.write('<body style="margin:0"><script>atOptions={key:"' + k + '",format:"iframe",height:50,width:320,params:{}};<\/script>' +
    '<script src="https://bauval.org/22/' + k + '"><\/script></body>');
  f.contentDocument.close();
}

/* =====================================================================
   OYUN
   ===================================================================== */
const cv = document.getElementById("game_canvas");
const cx2 = cv.getContext("2d");
const $ = (id) => document.getElementById(id);
let W, H, DPR, CX, CY, R;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cx2.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2 + 10;
  R = Math.min(W, H) * 0.32;
}
addEventListener("resize", resize);
resize();

let audio = null, muted = false;
function beep(freq, dur, type = "sine", vol = 0.08) {
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  } catch (e) {}
}
const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

const S = { state: "menu", score: 0, combo: 0, angle: -Math.PI / 2, dir: 1, speed: 1.6,
  beams: [], orbs: [], parts: [], t: 0, nextBeam: 1.2, nextOrb: 0.5, shake: 0, revived: false, games: 0 };
let best = 0;
try { best = +localStorage.getItem("yorunge_best") || 0; } catch (e) {}
$("menuBest").textContent = best ? T.best + best : "";

const angDiff = (a, b) => { let d = (a - b) % (Math.PI * 2); if (d < -Math.PI) d += Math.PI * 2; if (d > Math.PI) d -= Math.PI * 2; return Math.abs(d); };

function reset(keepScore) {
  if (!keepScore) { S.score = 0; S.combo = 0; S.revived = false; S.speed = 1.6; }
  S.angle = -Math.PI / 2; S.dir = 1; S.beams = []; S.orbs = []; S.parts = [];
  S.nextBeam = 1.2; S.nextOrb = 0.4; S.t = 0;
}

function start(keepScore) {
  reset(keepScore);
  S.state = "play";
  $("menu").classList.add("hidden");
  $("over").classList.add("hidden");
  track("oyun-basladi");
}

function gameOver() {
  S.state = "over";
  S.shake = 14;
  buzz([40, 30, 60]);
  beep(120, 0.4, "sawtooth", 0.12);
  S.games++;
  if (S.score > best) { best = S.score; try { localStorage.setItem("yorunge_best", best); } catch (e) {} }
  $("finalScore").textContent = S.score;
  $("finalBest").textContent = (S.score >= best && S.score > 0) ? T.record : T.best + best;
  $("reviveBtn").classList.add("hidden");
  track("oyun-bitti");
  setTimeout(() => {
    $("over").classList.remove("hidden");
    if (window.onGameOverAd) window.onGameOverAd(S.games);   // portal sürümleri (GameMonetize vb.) için
    showBanner("banner");
    offerRevive();
    if (ADS_ON && S.games % CONFIG.interstitialEvery === 0) {
      adBreak({ type: "next", name: "oyun_sonu",
        beforeAd: () => { muted = true; }, afterAd: () => { muted = false; },
        adBreakDone: (info) => { if (info && info.breakStatus === "viewed") track("gecis-reklami"); } });
    }
  }, 650);
}

let reviveFn = null;
function offerRevive() {
  reviveFn = null;
  if (!ADS_ON || S.revived || S.score < 20) return;
  adBreak({ type: "reward", name: "devam_et",
    beforeAd: () => { muted = true; }, afterAd: () => { muted = false; },
    beforeReward: (showAdFn) => { reviveFn = showAdFn; $("reviveBtn").classList.remove("hidden"); },
    adDismissed: () => { $("reviveBtn").classList.add("hidden"); },
    adViewed: () => { track("odullu-reklam"); S.revived = true; start(true); },
    adBreakDone: () => {} });
}
$("reviveBtn").onclick = (e) => { e.stopPropagation(); if (reviveFn) reviveFn(); };
$("playBtn").onclick = (e) => { e.stopPropagation(); beep(660, 0.1); start(false); };
$("againBtn").onclick = (e) => { e.stopPropagation(); beep(660, 0.1); start(false); };
$("shareBtn").onclick = async (e) => {
  e.stopPropagation();
  const url = location.origin + location.pathname + "?src=paylasim";
  const text = T.shareText(S.score) + " 🔵 " + url;
  track("paylasim");
  try { if (navigator.share) { await navigator.share({ title: "Yörünge", text, url }); return; } } catch (err) { return; }
  try { await navigator.clipboard.writeText(text); $("shareBtn").textContent = T.copied; } catch (err) {}
};

function tap(e) {
  if (S.state !== "play") return;
  e.preventDefault();
  S.dir *= -1;
  beep(440 + Math.random() * 80, 0.06, "triangle", 0.05);
  buzz(8);
  for (let i = 0; i < 6; i++) spark(px(), py(), "#3df2ff");
}
addEventListener("pointerdown", tap, { passive: false });
addEventListener("keydown", (e) => { if (e.code === "Space") tap(e); });

const px = () => CX + Math.cos(S.angle) * R;
const py = () => CY + Math.sin(S.angle) * R;
function spark(x, y, c) {
  const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 140;
  S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.4, c });
}

function update(dt) {
  S.t += dt;
  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; }
  S.parts = S.parts.filter((p) => p.life > 0);
  if (S.shake > 0) S.shake *= 0.88;
  if (S.state !== "play") return;

  const level = Math.min(S.score / 60, 1.6);
  S.speed = 1.6 + level * 1.1;
  S.angle += S.dir * S.speed * dt;

  // ışın üret
  S.nextBeam -= dt;
  if (S.nextBeam <= 0) {
    const n = S.score > 80 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      let a;
      do { a = Math.random() * Math.PI * 2; } while (angDiff(a, S.angle) < 0.9);
      S.beams.push({ a, warn: Math.max(0.55, 1.0 - level * 0.25), live: 0.45 });
    }
    S.nextBeam = Math.max(0.55, 1.5 - level * 0.55) + Math.random() * 0.4;
  }
  // orb üret
  S.nextOrb -= dt;
  if (S.nextOrb <= 0 && S.orbs.length < 3) {
    S.orbs.push({ a: Math.random() * Math.PI * 2, t: 0 });
    S.nextOrb = 0.9 + Math.random() * 0.8;
  }

  const hitW = 13 / R;
  for (const b of S.beams) {
    if (b.warn > 0) { b.warn -= dt; if (b.warn <= 0) { beep(180, 0.18, "square", 0.04); S.shake = 4; } }
    else {
      b.live -= dt;
      if (angDiff(b.a, S.angle) < hitW + 0.05) { for (let i = 0; i < 30; i++) spark(px(), py(), "#ff3d5a"); return gameOver(); }
    }
  }
  S.beams = S.beams.filter((b) => b.warn > 0 || b.live > 0);

  for (const o of S.orbs) {
    o.t += dt;
    if (angDiff(o.a, S.angle) < 18 / R) {
      o.got = true;
      S.combo++;
      S.score += 1 + Math.min(S.combo, 5);
      beep(880 + S.combo * 40, 0.09, "sine", 0.07);
      buzz(12);
      for (let i = 0; i < 14; i++) spark(CX + Math.cos(o.a) * R, CY + Math.sin(o.a) * R, "#ffd23d");
    } else if (o.t > 4.5) { o.got = true; S.combo = 0; }
  }
  S.orbs = S.orbs.filter((o) => !o.got);

  // hayatta kalma puanı
  if (Math.floor(S.t * 2) !== Math.floor((S.t - dt) * 2)) S.score += 1;
}

function draw() {
  const sx = (Math.random() - 0.5) * S.shake, sy = (Math.random() - 0.5) * S.shake;
  cx2.save();
  cx2.fillStyle = "rgba(7,7,26,0.35)";
  cx2.fillRect(0, 0, W, H);
  cx2.translate(sx, sy);

  // yörünge çemberi
  cx2.lineWidth = 2;
  cx2.strokeStyle = "rgba(61,242,255,0.35)";
  cx2.shadowColor = "#3df2ff"; cx2.shadowBlur = 12;
  cx2.beginPath(); cx2.arc(CX, CY, R, 0, Math.PI * 2); cx2.stroke();

  // merkez
  const pulse = 10 + Math.sin(S.t * 4) * 2;
  cx2.fillStyle = "#ff3df2"; cx2.shadowColor = "#ff3df2"; cx2.shadowBlur = 25;
  cx2.beginPath(); cx2.arc(CX, CY, pulse, 0, Math.PI * 2); cx2.fill();

  // ışınlar
  const far = Math.hypot(W, H);
  for (const b of S.beams) {
    const ex = CX + Math.cos(b.a) * far, ey = CY + Math.sin(b.a) * far;
    if (b.warn > 0) {
      cx2.setLineDash([8, 10]); cx2.lineWidth = 2;
      cx2.strokeStyle = "rgba(255,61,90," + (0.35 + 0.4 * Math.abs(Math.sin(S.t * 18))) + ")";
      cx2.shadowBlur = 6;
    } else {
      cx2.setLineDash([]); cx2.lineWidth = 12; cx2.strokeStyle = "#ff3d5a"; cx2.shadowColor = "#ff3d5a"; cx2.shadowBlur = 30;
    }
    cx2.beginPath(); cx2.moveTo(CX, CY); cx2.lineTo(ex, ey); cx2.stroke();
  }
  cx2.setLineDash([]);

  // orblar
  for (const o of S.orbs) {
    const x = CX + Math.cos(o.a) * R, y = CY + Math.sin(o.a) * R;
    const r = 8 + Math.sin(o.t * 6) * 1.5;
    cx2.fillStyle = "#ffd23d"; cx2.shadowColor = "#ffd23d"; cx2.shadowBlur = 22;
    cx2.beginPath(); cx2.arc(x, y, r, 0, Math.PI * 2); cx2.fill();
  }

  // oyuncu
  if (S.state === "play" || S.state === "menu") {
    if (S.state === "menu") S.angle += 0.012;
    cx2.fillStyle = "#3df2ff"; cx2.shadowColor = "#3df2ff"; cx2.shadowBlur = 28;
    cx2.beginPath(); cx2.arc(px(), py(), 11, 0, Math.PI * 2); cx2.fill();
  }

  // parçacıklar
  cx2.shadowBlur = 0;
  for (const p of S.parts) {
    cx2.globalAlpha = Math.max(p.life * 1.6, 0);
    cx2.fillStyle = p.c;
    cx2.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  cx2.globalAlpha = 1;
  cx2.restore();

  $("score").textContent = S.state === "menu" ? "" : S.score;
  $("combo").textContent = S.state === "play" && S.combo > 1 ? "COMBO x" + Math.min(S.combo, 5) : "";
}

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Menüde banner göster + giriş sayacı
showBanner("bannerMenu");
if (ADS_ON) {
  // Oyun açılışında (preroll) reklam: AdSense uygun görürse gösterir.
  adBreak({ type: "preroll", adBreakDone: () => {} });
}
document.addEventListener("visibilitychange", () => { muted = document.hidden; });
</script>
</body>
</html>
